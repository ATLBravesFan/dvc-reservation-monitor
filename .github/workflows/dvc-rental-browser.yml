name: DVC-Rental browser watch

on:
  # Primary 10-minute cadence is dispatched by the Cloudflare Worker.
  # This lower-frequency cron remains only as a fallback if dispatching fails.
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dvc-rental-browser-watch
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install browser dependency
        run: npm install --omit=dev --no-audit --no-fund
      - name: Scrape DVC-Rental with point details
        env:
          DVC_MONITOR_BASE_URL: ${{ secrets.DVC_MONITOR_BASE_URL }}
          DVC_MONITOR_INGEST_TOKEN: ${{ secrets.DVC_MONITOR_INGEST_TOKEN }}
          CHROME_PATH: /usr/bin/google-chrome
        run: node scripts/dvc-rental-browser.mjs
