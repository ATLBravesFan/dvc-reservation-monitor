name: Deploy DVC monitor

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-dvc-monitor
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate monitor
        run: npm run check
      - name: Provision D1, apply migrations, deploy Worker and secrets
        run: node scripts/deploy-github.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          PUSHOVER_EMAIL: ${{ secrets.PUSHOVER_EMAIL }}
          DVC_MONITOR_INGEST_TOKEN: ${{ secrets.DVC_MONITOR_INGEST_TOKEN }}
          DVC_MONITOR_ADMIN_TOKEN: ${{ secrets.DVC_MONITOR_ADMIN_TOKEN }}
          DVC_GITHUB_DISPATCH_TOKEN: ${{ secrets.DVC_GITHUB_DISPATCH_TOKEN }}
