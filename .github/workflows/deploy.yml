name: Deploy DVC monitor

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/run-deploy.once"

permissions:
  contents: read

concurrency:
  group: deploy-dvc-monitor
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Apply production cadence policy
        run: node scripts/apply-runtime-cadences.mjs
      - name: Validate monitor
        run: npm run check
      - name: Ensure Cloudflare Queue exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if npx --no-install wrangler queues info dvc-monitor-ticks; then
            echo "Using existing dvc-monitor-ticks Queue."
          else
            echo "Queue does not exist yet; creating dvc-monitor-ticks."
            npx --no-install wrangler queues create dvc-monitor-ticks
          fi
      - name: Provision D1, apply migrations, deploy Worker and secrets
        run: node scripts/deploy-github.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          PUSHOVER_EMAIL: ${{ secrets.PUSHOVER_EMAIL }}
          DVC_MONITOR_INGEST_TOKEN: ${{ secrets.DVC_MONITOR_INGEST_TOKEN }}
          DVC_MONITOR_ADMIN_TOKEN: ${{ secrets.DVC_MONITOR_ADMIN_TOKEN }}
          DVC_GITHUB_DISPATCH_TOKEN: ${{ secrets.DVC_GITHUB_DISPATCH_TOKEN }}
      - name: Verify DVCReservations Rare Finds
        env:
          DVC_MONITOR_BASE_URL: ${{ secrets.DVC_MONITOR_BASE_URL }}
          DVC_MONITOR_ADMIN_TOKEN: ${{ secrets.DVC_MONITOR_ADMIN_TOKEN }}
        run: |
          test -n "$DVC_MONITOR_BASE_URL"
          test -n "$DVC_MONITOR_ADMIN_TOKEN"
          curl --fail --show-error --silent \
            -X POST \
            -H "Authorization: Bearer $DVC_MONITOR_ADMIN_TOKEN" \
            "${DVC_MONITOR_BASE_URL%/}/run?mode=rare-finds"
      - name: Kick DVC-Rental browser verification
        env:
          DVC_GITHUB_DISPATCH_TOKEN: ${{ secrets.DVC_GITHUB_DISPATCH_TOKEN }}
        run: |
          test -n "$DVC_GITHUB_DISPATCH_TOKEN"
          code=$(curl --silent --show-error --output /tmp/dvc-rental-dispatch.txt --write-out "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer $DVC_GITHUB_DISPATCH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            https://api.github.com/repos/ATLBravesFan/dvc-reservation-monitor/actions/workflows/dvc-rental-browser.yml/dispatches \
            -d '{"ref":"main"}')
          test "$code" = "204" || { cat /tmp/dvc-rental-dispatch.txt; echo "Dispatch returned HTTP $code"; exit 1; }
