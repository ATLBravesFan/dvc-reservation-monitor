name: DVCReservations Rare Finds browser backup

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dvcreservations-rare-finds-browser
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install browser dependency
        run: npm install --omit=dev --no-audit --no-fund
      - name: Scrape and ingest Rare Finds
        env:
          DVC_MONITOR_BASE_URL: ${{ secrets.DVC_MONITOR_BASE_URL }}
          DVC_MONITOR_INGEST_TOKEN: ${{ secrets.DVC_MONITOR_INGEST_TOKEN }}
          CHROME_PATH: /usr/bin/google-chrome
        run: node scripts/rare-finds-browser.mjs
