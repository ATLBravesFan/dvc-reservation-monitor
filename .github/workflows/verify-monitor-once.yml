name: Verify DVC monitor state

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/run-verify.once"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify live Worker, D1 health and Rental Store snapshot
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DVC_MONITOR_BASE_URL: ${{ secrets.DVC_MONITOR_BASE_URL }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          node --input-type=module <<'NODE'
          import { URLS } from './src/config.js';
          import { parseKeyholder, byId, fingerprint } from './src/parsers.js';

          const required = ['CLOUDFLARE_API_TOKEN','CLOUDFLARE_ACCOUNT_ID','DVC_MONITOR_BASE_URL'];
          for (const key of required) if (!process.env[key]) throw new Error(`${key} missing`);

          const base = process.env.DVC_MONITOR_BASE_URL.replace(/\/$/, '');
          const healthResponse = await fetch(`${base}/health`);
          if (!healthResponse.ok) throw new Error(`Worker health HTTP ${healthResponse.status}`);
          const health = await healthResponse.json();
          console.log('WORKER_HEALTH=' + JSON.stringify({
            ok: health.ok,
            cron: health.cron,
            checkedAt: health.checkedAt,
            emailUsageToday: health.emailUsageToday,
            alertOutbox: health.alertOutbox,
            health: health.health,
          }, null, 2));

          const account = process.env.CLOUDFLARE_ACCOUNT_ID;
          const headers = {
            Authorization: `Bearer ${process.env.CLOUDFLARE_API_TOKEN}`,
            'Content-Type': 'application/json',
          };
          const dbList = await fetch(`https://api.cloudflare.com/client/v4/accounts/${account}/d1/database?name=dvc-monitor-state&per_page=100`, { headers });
          const dbBody = await dbList.json();
          if (!dbList.ok || !dbBody.success) throw new Error('Could not list D1 database');
          const db = (dbBody.result || []).find(row => row.name === 'dvc-monitor-state');
          if (!db?.uuid) throw new Error('dvc-monitor-state not found');

          async function query(sql, params = []) {
            const r = await fetch(`https://api.cloudflare.com/client/v4/accounts/${account}/d1/database/${db.uuid}/query`, {
              method: 'POST', headers, body: JSON.stringify({ sql, params }),
            });
            const body = await r.json();
            if (!r.ok || !body.success) throw new Error(`D1 query failed: ${JSON.stringify(body.errors || body)}`);
            return body.result?.[0]?.results || [];
          }

          const sourceRows = await query(`SELECT source, ok, last_checked_at, last_success_at, consecutive_failures, last_error, details FROM health ORDER BY source`);
          console.log('D1_SOURCE_HEALTH=' + JSON.stringify(sourceRows, null, 2));
          const snapshotRows = await query(`SELECT source, updated_at FROM snapshots ORDER BY source`);
          console.log('D1_SNAPSHOTS=' + JSON.stringify(snapshotRows, null, 2));
          const outboxCounts = await query(`SELECT status, COUNT(*) AS count FROM alert_outbox GROUP BY status ORDER BY status`);
          console.log('OUTBOX_COUNTS=' + JSON.stringify(outboxCounts, null, 2));
          const problemRows = await query(`SELECT alert_key, source, listing_id, status, attempts, created_at, updated_at, next_attempt_at, last_error, title, priority, payload FROM alert_outbox WHERE status IN ('pending','uncertain') ORDER BY created_at`);
          const problemSummary = problemRows.map(row => {
            let event = null;
            try { event = JSON.parse(row.payload); } catch {}
            return {
              alert_key: row.alert_key,
              source: row.source,
              listing_id: row.listing_id,
              status: row.status,
              attempts: row.attempts,
              created_at: row.created_at,
              updated_at: row.updated_at,
              next_attempt_at: row.next_attempt_at,
              last_error: row.last_error,
              title: row.title,
              priority: row.priority,
              event_type: event?.type || null,
              resort: event?.listing?.resort || event?.listing?.resortName || null,
              room: event?.listing?.roomType || event?.listing?.room || null,
              check_in: event?.listing?.checkIn || null,
              check_out: event?.listing?.checkOut || null,
              total: event?.listing?.total ?? null,
              nightly: event?.listing?.nightly ?? null,
              points: event?.listing?.points ?? null,
              price_per_point: event?.listing?.pricePerPoint ?? null,
            };
          });
          console.log('PROBLEM_OUTBOX=' + JSON.stringify(problemSummary, null, 2));

          if (process.env.BREVO_API_KEY && process.env.EMAIL_TO && problemRows.some(row => row.status === 'uncertain')) {
            const today = new Date().toISOString().slice(0,10);
            const u = new URL('https://api.brevo.com/v3/smtp/emails');
            u.searchParams.set('email', process.env.EMAIL_TO);
            u.searchParams.set('startDate', today);
            u.searchParams.set('endDate', today);
            u.searchParams.set('sort', 'desc');
            u.searchParams.set('limit', '1000');
            const r = await fetch(u, { headers: { Accept: 'application/json', 'api-key': process.env.BREVO_API_KEY } });
            const body = await r.json();
            if (!r.ok) throw new Error(`Brevo transactional email lookup failed ${r.status}: ${JSON.stringify(body).slice(0,500)}`);
            const emails = (body.transactionalEmails || []).map(x => ({ date:x.date, messageId:x.messageId, subject:x.subject, uuid:x.uuid }));
            console.log('BREVO_EMAILS_TODAY=' + JSON.stringify(emails, null, 2));

            const uncertainRows = problemRows.filter(row => row.status === 'uncertain');
            const matched = [];
            for (const row of uncertainRows) {
              const t = Date.parse(row.updated_at || row.created_at || '');
              const candidates = emails.filter(x => Number.isFinite(t) && Math.abs(Date.parse(x.date) - t) <= 5*60*1000);
              matched.push({ alert_key: row.alert_key, listing_id: row.listing_id, updated_at: row.updated_at, candidates });
            }
            console.log('UNCERTAIN_BREVO_MATCHES=' + JSON.stringify(matched, null, 2));

            const ids = [...new Set(matched.flatMap(x => x.candidates.map(c => c.messageId)).filter(Boolean))];
            const delivery = [];
            for (const messageId of ids) {
              const eu = new URL('https://api.brevo.com/v3/smtp/statistics/events');
              eu.searchParams.set('messageId', messageId);
              eu.searchParams.set('days', '1');
              eu.searchParams.set('limit', '100');
              eu.searchParams.set('sort', 'asc');
              const er = await fetch(eu, { headers: { Accept: 'application/json', 'api-key': process.env.BREVO_API_KEY } });
              const eb = await er.json();
              delivery.push({ messageId, ok: er.ok, events: (eb.events || []).map(e => ({ date:e.date, event:e.event, reason:e.reason || null, tag:e.tag || null })) });
            }
            console.log('BREVO_MATCHED_DELIVERY_EVENTS=' + JSON.stringify(delivery, null, 2));
          }

          const recentExecutions = await query(`SELECT source, started_at, finished_at, outcome, error FROM execution_history WHERE julianday(started_at) >= julianday('now','-10 minutes') ORDER BY started_at DESC LIMIT 100`);
          console.log('RECENT_EXECUTIONS=' + JSON.stringify(recentExecutions, null, 2));
          const alertCounts = await query(`SELECT source, COUNT(*) AS sent_count, MIN(sent_at) AS first_sent, MAX(sent_at) AS last_sent FROM alerts WHERE status='sent' AND sent_at >= datetime('now','-2 hours') GROUP BY source ORDER BY source`);
          console.log('RECENT_ALERT_COUNTS=' + JSON.stringify(alertCounts, null, 2));

          const snapshotResult = await query(`SELECT payload, updated_at FROM snapshots WHERE source='rental-store-all'`);
          if (!snapshotResult[0]?.payload) throw new Error('rental-store-all snapshot missing');
          const previous = JSON.parse(snapshotResult[0].payload);

          const apiResponse = await fetch(URLS.rentalStoreApi, { headers: { Accept: 'application/json', 'User-Agent': 'DVC-Monitor-Verification/1.0' } });
          if (!apiResponse.ok) throw new Error(`Rental Store API HTTP ${apiResponse.status}`);
          const currentRows = parseKeyholder(await apiResponse.json());
          const current = byId(currentRows);
          const previousIds = new Set(Object.keys(previous));
          const currentIds = new Set(Object.keys(current));
          const newIds = [...currentIds].filter(id => !previousIds.has(id));
          const removedIds = [...previousIds].filter(id => !currentIds.has(id));
          const changedIds = [...currentIds].filter(id => previous[id] && fingerprint(previous[id]) !== fingerprint(current[id]));
          console.log('RENTAL_STORE_COMPARE=' + JSON.stringify({
            snapshotUpdatedAt: snapshotResult[0].updated_at,
            previousCount: previousIds.size,
            currentCount: currentIds.size,
            newCount: newIds.length,
            changedCount: changedIds.length,
            removedCount: removedIds.length,
            sampleNew: newIds.slice(0, 10),
            sampleChanged: changedIds.slice(0, 10),
          }, null, 2));
          NODE
