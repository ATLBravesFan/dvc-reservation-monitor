name: Test DVC monitor email

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-email:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Send test email through Worker
        env:
          DVC_MONITOR_BASE_URL: ${{ secrets.DVC_MONITOR_BASE_URL }}
          DVC_MONITOR_ADMIN_TOKEN: ${{ secrets.DVC_MONITOR_ADMIN_TOKEN }}
        run: |
          test -n "$DVC_MONITOR_BASE_URL"
          test -n "$DVC_MONITOR_ADMIN_TOKEN"
          curl --fail --show-error --silent \
            -X POST \
            -H "Authorization: Bearer $DVC_MONITOR_ADMIN_TOKEN" \
            "${DVC_MONITOR_BASE_URL%/}/run?mode=test-email"
