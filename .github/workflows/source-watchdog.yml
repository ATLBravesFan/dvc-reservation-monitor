name: DVC source recovery watchdog

on:
  schedule:
    # Cloudflare handles five-minute recovery; GitHub is a best-effort backup.
    # Stagger away from minute 0 to reduce scheduled Actions congestion.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/source-watchdog.yml"

permissions:
  contents: read

concurrency:
  group: dvc-source-watchdog
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Recover abandoned email deliveries
        shell: bash
        env:
          DVC_MONITOR_BASE_URL: ${{ secrets.DVC_MONITOR_BASE_URL }}
          DVC_MONITOR_ADMIN_TOKEN: ${{ secrets.DVC_MONITOR_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$DVC_MONITOR_BASE_URL"
          test -n "$DVC_MONITOR_ADMIN_TOKEN"
          curl --fail --show-error --silent --max-time 35 \
            -X POST \
            -H "Authorization: Bearer $DVC_MONITOR_ADMIN_TOKEN" \
            "${DVC_MONITOR_BASE_URL%/}/run?mode=drain-outbox"
          echo
      - name: Recover consistently overdue sources
        run: node scripts/watchdog.mjs
        env:
          DVC_MONITOR_BASE_URL: ${{ secrets.DVC_MONITOR_BASE_URL }}
          DVC_MONITOR_ADMIN_TOKEN: ${{ secrets.DVC_MONITOR_ADMIN_TOKEN }}
