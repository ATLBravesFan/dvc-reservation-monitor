name: D1 missed-alert audit

on:
  push:
    paths:
      - ".github/workflows/d1-missed-alert-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DVC_MONITOR_BASE_URL: ${{ secrets.DVC_MONITOR_BASE_URL }}
      DVC_MONITOR_ADMIN_TOKEN: ${{ secrets.DVC_MONITOR_ADMIN_TOKEN }}
    steps:
      - name: Recover the three confirmed missed alerts
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$DVC_MONITOR_BASE_URL"
          test -n "$DVC_MONITOR_ADMIN_TOKEN"

          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json")
          db_json=$(curl --fail --silent --show-error "${auth[@]}" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database")
          db_id=$(printf '%s' "$db_json" | jq -r '.result[] | select(.name=="dvc-monitor-state") | .uuid' | head -1)
          test -n "$db_id" -a "$db_id" != "null"

          query() {
            local sql="$1"
            curl --fail --silent --show-error "${auth[@]}" \
              -X POST \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/$db_id/query" \
              --data "$(jq -nc --arg sql "$sql" '{sql:$sql}')" | jq -c '.result[]?.results // []'
          }

          ids="'a0fVJ000004EhQzYAK','a0fVJ000004EnJVYA0','a0fVJ000004EpbRYAS'"

          echo '=== before recovery ==='
          query "SELECT listing_id,status,attempts,last_error FROM alert_outbox WHERE listing_id IN ($ids) ORDER BY listing_id;"

          # Gmail was audited and none of these three alerts was delivered. Only
          # these exact uncertain rows are requeued; already-sent rows are never touched.
          query "UPDATE alert_outbox SET status='pending',next_attempt_at=CURRENT_TIMESTAMP,lease_until=NULL,last_error='Requeued after Gmail audit confirmed no delivery',updated_at=CURRENT_TIMESTAMP WHERE status='uncertain' AND listing_id IN ($ids);"

          echo '=== drain recovered alerts through deployed Worker ==='
          curl --fail --show-error --silent \
            -X POST \
            -H "Authorization: Bearer $DVC_MONITOR_ADMIN_TOKEN" \
            "${DVC_MONITOR_BASE_URL%/}/run?mode=drain-outbox"
          echo

          sleep 2
          echo '=== after recovery ==='
          result=$(query "SELECT listing_id,status,attempts,last_error FROM alert_outbox WHERE listing_id IN ($ids) ORDER BY listing_id;")
          echo "$result"
          test "$(printf '%s' "$result" | jq '[.[] | select(.status=="sent")] | length')" = "3"
