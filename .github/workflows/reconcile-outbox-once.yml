name: Reconcile confirmed DVC alert delivery

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/run-verify.once"

permissions:
  contents: read

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Reconcile only the three Brevo-confirmed uncertain alerts
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          DVC_MONITOR_BASE_URL: ${{ secrets.DVC_MONITOR_BASE_URL }}
        run: |
          node --input-type=module <<'NODE'
          const required=['CLOUDFLARE_API_TOKEN','CLOUDFLARE_ACCOUNT_ID','BREVO_API_KEY','EMAIL_TO'];
          for(const k of required) if(!process.env[k]) throw new Error(`${k} missing`);
          const targetIds=['DVC10022','DVC10023','DVC10024'];
          const account=process.env.CLOUDFLARE_ACCOUNT_ID;
          const cfHeaders={Authorization:`Bearer ${process.env.CLOUDFLARE_API_TOKEN}`,'Content-Type':'application/json'};
          const dbList=await fetch(`https://api.cloudflare.com/client/v4/accounts/${account}/d1/database?name=dvc-monitor-state&per_page=100`,{headers:cfHeaders});
          const dbBody=await dbList.json();
          const db=(dbBody.result||[]).find(x=>x.name==='dvc-monitor-state');
          if(!db?.uuid) throw new Error('dvc-monitor-state not found');
          async function query(sql,params=[]){
            const r=await fetch(`https://api.cloudflare.com/client/v4/accounts/${account}/d1/database/${db.uuid}/query`,{method:'POST',headers:cfHeaders,body:JSON.stringify({sql,params})});
            const b=await r.json();
            if(!r.ok||!b.success) throw new Error(`D1 query failed: ${JSON.stringify(b.errors||b)}`);
            return b.result?.[0]?.results||[];
          }
          async function exec(sql,params=[]){
            const r=await fetch(`https://api.cloudflare.com/client/v4/accounts/${account}/d1/database/${db.uuid}/query`,{method:'POST',headers:cfHeaders,body:JSON.stringify({sql,params})});
            const b=await r.json();
            if(!r.ok||!b.success) throw new Error(`D1 write failed: ${JSON.stringify(b.errors||b)}`);
            return b.result?.[0]||{};
          }

          const rows=await query(`SELECT alert_key,source,listing_id,status,attempts,created_at,updated_at,title,last_error FROM alert_outbox WHERE status='uncertain' AND listing_id IN (?,?,?) ORDER BY listing_id`,targetIds);
          if(rows.length===0){
            console.log('Targets already reconciled; nothing to change.');
          } else {
            const actual=rows.map(r=>r.listing_id).sort();
            const expected=[...targetIds].sort();
            if(rows.length!==3||JSON.stringify(actual)!==JSON.stringify(expected)) throw new Error(`Refusing mutation: expected exactly ${expected.join(',')}, got ${actual.join(',')}`);
            if(rows.some(r=>r.source!=='dvc-rental'||r.attempts!==2||r.title!=='DVC-Rental New Confirmed Reservations')) throw new Error('Refusing mutation: target metadata no longer matches audited rows');

            const u=new URL('https://api.brevo.com/v3/smtp/emails');
            u.searchParams.set('email',process.env.EMAIL_TO);
            u.searchParams.set('startDate','2026-10-12');
            u.searchParams.set('endDate','2026-10-12');
            u.searchParams.set('sort','asc');
            u.searchParams.set('limit','1000');
            const br=await fetch(u,{headers:{Accept:'application/json','api-key':process.env.BREVO_API_KEY}});
            const bb=await br.json();
            if(!br.ok) throw new Error(`Brevo lookup failed ${br.status}: ${JSON.stringify(bb).slice(0,500)}`);
            const candidates=(bb.transactionalEmails||[]).filter(x=>{
              const t=Date.parse(x.date);
              return x.subject==='DVC-Rental New Confirmed Reservations — 3 new' && t>=Date.parse('2026-10-12T16:20:00Z') && t<=Date.parse('2026-10-12T16:30:00Z');
            });
            if(candidates.length!==1) throw new Error(`Refusing mutation: expected one matching Brevo email, found ${candidates.length}`);
            const message=candidates[0];
            const eu=new URL('https://api.brevo.com/v3/smtp/statistics/events');
            eu.searchParams.set('messageId',message.messageId);
            eu.searchParams.set('startDate','2026-10-12');
            eu.searchParams.set('endDate','2026-10-12');
            eu.searchParams.set('limit','100');
            eu.searchParams.set('sort','asc');
            const er=await fetch(eu,{headers:{Accept:'application/json','api-key':process.env.BREVO_API_KEY}});
            const eb=await er.json();
            if(!er.ok) throw new Error(`Brevo event lookup failed ${er.status}`);
            const delivered=(eb.events||[]).filter(e=>e.event==='delivered');
            if(delivered.length<1) throw new Error('Refusing mutation: Brevo does not confirm delivery');
            const deliveredAt=new Date(Math.min(...delivered.map(e=>Date.parse(e.date)).filter(Number.isFinite))).toISOString();
            const expiry=new Date(Date.parse(deliveredAt)+60*24*60*60*1000).toISOString();

            for(const row of rows){
              const result=await exec(`UPDATE alert_outbox SET status='sent',provider_message_id=?,last_error=NULL,lease_until=NULL,next_attempt_at=NULL,updated_at=? WHERE alert_key=? AND status='uncertain'`,[message.messageId,new Date().toISOString(),row.alert_key]);
              const changes=Number(result.meta?.changes||0);
              if(changes!==1) throw new Error(`Expected one outbox row update for ${row.listing_id}, got ${changes}`);
              await exec(`UPDATE alerts SET status='sent',sent_at=COALESCE(sent_at,?),expires_at=? WHERE alert_key=?`,[deliveredAt,expiry,row.alert_key]);
            }
            console.log('RECONCILED='+JSON.stringify({listingIds:targetIds,messageId:message.messageId,deliveredAt},null,2));
          }

          const counts=await query(`SELECT status,COUNT(*) AS count FROM alert_outbox GROUP BY status ORDER BY status`);
          const remaining=await query(`SELECT listing_id,status,last_error FROM alert_outbox WHERE status IN ('pending','sending','uncertain') ORDER BY created_at`);
          console.log('OUTBOX_COUNTS='+JSON.stringify(counts,null,2));
          console.log('REMAINING_PROBLEMS='+JSON.stringify(remaining,null,2));
          if(process.env.DVC_MONITOR_BASE_URL){
            const h=await fetch(`${process.env.DVC_MONITOR_BASE_URL.replace(/\/$/,'')}/health`);
            const hb=await h.json();
            console.log('HEALTH_AFTER='+JSON.stringify({ok:hb.ok,alertOutbox:hb.alertOutbox,health:hb.health},null,2));
          }
          NODE
