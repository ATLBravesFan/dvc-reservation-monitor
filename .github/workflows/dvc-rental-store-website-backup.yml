name: DVC Rental Store website backup

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dvc-rental-store-website-backup
  cancel-in-progress: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install browser dependency
        run: npm install --omit=dev --no-audit --no-fund
      - name: Scrape DVC Rental Store website
        env:
          DVC_MONITOR_BASE_URL: ${{ secrets.DVC_MONITOR_BASE_URL }}
          DVC_MONITOR_INGEST_TOKEN: ${{ secrets.DVC_MONITOR_INGEST_TOKEN }}
          DVC_BROWSER_JOB: rental-store
          CHROME_PATH: /usr/bin/google-chrome
        run: node scripts/browser-backups.mjs
