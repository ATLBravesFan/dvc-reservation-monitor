name: DVC Rental Store website backup

on:
  schedule:
    # Independent recovery every 15 minutes if Worker dispatches stop.
    # The Worker normally dispatches this browser job every five minutes.
    - cron: "2,17,32,47 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dvc-rental-store-website-backup
  # Let an in-flight recovery attempt finish instead of killing it when the
  # next Worker dispatch arrives.
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install browser dependency
        run: npm install --omit=dev --no-audit --no-fund

      - name: Scrape DVC Rental Store website
        env:
          DVC_MONITOR_BASE_URL: ${{ secrets.DVC_MONITOR_BASE_URL }}
          DVC_MONITOR_INGEST_TOKEN: ${{ secrets.DVC_MONITOR_INGEST_TOKEN }}
          DVC_BROWSER_JOB: rental-store
          CHROME_PATH: /usr/bin/google-chrome
        shell: bash
        run: |
          # DVC Rental Store intermittently returns Cloudflare 520s or a partial
          # page to GitHub-hosted browsers. Try three times with a fresh browser,
          # separated by short pauses. This suppresses a one-off transient failure
          # while still failing the workflow within a few minutes if the site stays
          # unhealthy, so GitHub can notify promptly. The scraper itself refuses to
          # ingest zero/incomplete inventory, so a bad page can never replace good state.
          log_file="$(mktemp)"
          for attempt in 1 2 3; do
            echo "Rental Store browser attempt $attempt of 3"
            if node scripts/browser-backups.mjs 2>&1 | tee "$log_file"; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Transient browser failure; waiting 15 seconds before retry."
              sleep 15
            fi
          done
          # Cloudflare 520 and an empty/partial website are upstream availability
          # problems, not evidence that our primary API monitor has failed.
          # Keep the last good D1 snapshot and avoid repeated GitHub failure
          # notifications for this optional browser backup. Log a visible warning
          # so persistent site issues remain diagnosable.
          if grep -Eq "HTTP 520|returned zero reservations|usable reservations: 0" "$log_file"; then
            echo "::warning title=Rental Store website temporarily unavailable::Browser backup could not obtain complete inventory after three attempts. No snapshot was ingested; primary API monitoring is unaffected. Check backup freshness if this persists."
            exit 0
          fi
          echo "Rental Store browser backup failed all three attempts for an unexpected reason."
          exit 1
